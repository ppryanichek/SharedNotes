server:
  port: 8080

spring:
  application:
    name: SharedNotes
  # DB
  datasource:
    url: jdbc:postgresql://db:5432/shared_notes
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # Hibernate
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:

      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

# JWT
jwt:
  secret: ${JWT_SECRET}
  access:
    expiration: ${ACCESS_EXPIRATION}
  refresh:
    expiration: ${REFRESH_EXPIRATION}
