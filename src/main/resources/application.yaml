server:
  port: 8080

spring:
  application:
    name: SharedNotes

  datasource:
    url: jdbc:postgresql://db:5432/shared_notes
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hiberante.dialect.PostgreSQLDialect
        format_sql: true

jwt:
  secret: ${JWT_SECRET}
  access:
    expiration: 900_000 # 15 min
  refresh:
    expiration: 604_800_000 # 7 days